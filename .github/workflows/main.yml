name: VOX Doomsday Ticket Monitor

on:
  workflow_dispatch:
  schedule:
    # Runs every 5 minutes (UTC). GitHub Actions may delay scheduled runs.
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: vox-doomsday-ticket-monitor
  cancel-in-progress: true

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Check VOX ticket availability
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python check.py
